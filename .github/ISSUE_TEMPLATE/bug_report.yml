name: Bug report
description: Report a reproducible FirstPay defect without including secrets or personal data.
body:
  - type: textarea
    id: summary
    attributes: { label: Summary }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: impact
    attributes: { label: Impact and environment }
    validations: { required: true }
